 $('#rd').innerHTML=`<button id="back">← 返回列表</button><div class="meta">${esc((i.date||'').slice(0,16).replace('T',' '))} · ${esc(i.source)}</div>
 <h2>${esc(i.title)}</h2><div class="meta">${i.link?`<a href="${esc(i.link)}" target="_blank" rel="noopener">原链接 ↗</a>`:''}${i.audio_url?` · <a href="${esc(i.audio_url)}" target="_blank" rel="noopener">音频 ↗</a>`:''}</div>
 ${t.length?`<div class="tabs">${t.map((x,k)=>`<button data-k="${k}" class="${k===tab?'on':''}">${esc(x.label)}</button>`).join('')}</div><div id="txt">加载中…</div>`:'<p class="meta">该条目没有文本，请打开原链接。</p>'}
 <p class="hint">快捷键：j/k 或 ↓/↑ 切换条目 · t 或 ←/→ 切换 总结/原文</p>`;
 $('#back').onclick=()=>document.body.classList.remove('reading');
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=+b.dataset.k;render()});
 if(t.length){const u=t[tab].url,c=i.id,set=x=>{if(ITEMS[cur].id===c)$('#txt').textContent=x};
  cache[u]?set(cache[u]):fetch(u).then(r=>r.ok?r.text():Promise.reject()).then(x=>{cache[u]=x;set(x);
   const nx=ITEMS[cur+1];nx&&nx.txt&&nx.txt[0]&&!cache[nx.txt[0].url]&&fetch(nx.txt[0].url).then(r=>r.text()).then(y=>cache[nx.txt[0].url]=y)}).catch(()=>set('加载失败。'))}}
function fromHash(){const h=decodeURIComponent(location.hash.slice(1));const n=ITEMS.findIndex(i=>i.id===h);if(n>=0&&n!==cur)show(n,false)}
$('#list').addEventListener('click',e=>{const a=e.target.closest('.it');if(a){e.preventDefault();show(+a.dataset.n)}});
addEventListener('hashchange',fromHash);
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey||/INPUT|TEXTAREA/.test(e.target.tagName))return;const k=e.key;
 if(k==='j'||k==='ArrowDown'){e.preventDefault();show(Math.max(cur,-1)+1)}else if(k==='k'||k==='ArrowUp'){e.preventDefault();show(Math.max(cur-1,0))}
 else if((k==='t'||k==='ArrowRight'||k==='ArrowLeft')&&cur>=0){const L=(ITEMS[cur].txt||[]).length;if(L>1){tab=(tab+(k==='ArrowLeft'?L-1:1))%L;render()}}
 else if(k==='Escape')document.body.classList.remove('reading')});
if(location.hash)fromHash();else{const n=ITEMS.findIndex(i=>i.id===localStorage.getItem(LK));
 if(innerWidth>760)show(n>=0?n:0,true);else if(n>=0)els[n].scrollIntoView({block:'center'})}
