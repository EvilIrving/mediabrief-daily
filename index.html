*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.6 MB,-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);display:flex;-webkit-font-smoothing:antialiased}
a{color:var(--act)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#side{width:360px;flex:none;border-right:1px solid var(--bd);overflow-y:auto;height:100%}
#side h1{font-size:1.1rem;margin:0;padding:14px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:1}
#side h1 small{color:var(--dim);font-weight:400;font-size:11px}
.day{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);padding:10px 14px 2px}
.it{display:block;padding:5px 14px 5px 11px;border-left:3px solid transparent;text-decoration:none;color:var(--tx);content-visibility:auto;contain-intrinsic-size:auto 44px}
.it:focus{outline:none}.it:focus-visible{outline:1px dashed var(--ac);outline-offset:-2px}
.tabs button:focus{outline:none}.tabs button:focus-visible{outline:1px dashed var(--ac);outline-offset:1px}
.it:hover{background:var(--sf2)}.it.on{background:var(--sf2);border-left-color:var(--ac)}

 const add=(a,b)=>el.insertAdjacentHTML('beforeend',bs.slice(a,b).join(''));
 add(0,30);let k=30;const more=()=>{if(tok!==paintTok||k>=bs.length)return;add(k,k+80);k+=80;idle(more)};idle(more)}
function clean(x,i){const L=x.split('\n'),T=(i.title||'').trim();let k=0;
 while(k<L.length&&k<6){const l=L[k].trim();if(!l||(i.link&&l===i.link)||(T&&l.startsWith(T))||/^https?:\/\/\S+$/.test(l)&&k<2)k++;else break}return L.slice(k).join('\n')}
function fromHash(){const h=decodeURIComponent(location.hash.slice(1));const n=ITEMS.findIndex(i=>i.id===h);if(n>=0&&n!==cur)show(n,false)}
const sw=(a,on)=>{const t=a&&a.querySelector('.t[data-alt]');if(!t)return;if(on&&!t.dataset.cur){t.dataset.cur=t.textContent;t.textContent=t.dataset.alt}else if(!on&&t.dataset.cur){t.textContent=t.dataset.cur;delete t.dataset.cur}};

['touchend','touchcancel','touchmove'].forEach(v=>$('#list').addEventListener(v,()=>{clearTimeout(lp);if(lpDone)setTimeout(()=>sw(lpA,0),1200)},{passive:true}));

 if(k==='j'||k==='ArrowDown'){e.preventDefault();show(Math.max(cur,-1)+1)}else if(k==='k'||k==='ArrowUp'){e.preventDefault();show(Math.max(cur-1,0))}
 else if((k==='t'||k==='ArrowRight'||k==='ArrowLeft')&&cur>=0){const L=(ITEMS[cur].txt||[]).length;if(L>1){tab=(tab+(k==='ArrowLeft'?L-1:1))%L;render()}}
 else if(k==='Escape')document.body.classList.remove('reading')});
if(location.hash)fromHash();else{const n=ITEMS.findIndex(i=>i.id===localStorage.getItem(LK));

<script type="module">
// Fit each title on ONE line: one font size per row so original AND Chinese both fit (zero shift on swap).
const FAM='MB,-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif',REF=100,MIN=11,MAX=14;
let measure;
try{const P=await import('https://cdn.jsdelivr.net/npm/@chenglou/pretext@0.0.9/+esm');
 measure=(t,f)=>P.measureNaturalWidth(P.prepareWithSegments(t,f));window.__fitEngine='pretext'}
catch(e){const c=document.createElement('canvas').getContext('2d');measure=(t,f)=>{c.font=f;return c.measureText(t).width};window.__fitEngine='canvas'}
const ts=[...document.querySelectorAll('#list .it .t')];let cache=new Map();
const wOf=t=>{const f=`600 ${REF}px ${FAM}`,k=t;if(!cache.has(k))cache.set(k,measure(t,f));return cache.get(k)};
function fit(){const sample=ts[0];if(!sample)return;const avail=sample.clientWidth-2;
 for(const el of ts){const a=el.dataset.cur||el.textContent,z=el.dataset.alt||'';const w=Math.max(wOf(a),z?wOf(z):0);
  const fs=Math.floor(avail*REF/w*10)/10;el.style.fontSize=Math.max(MIN,Math.min(MAX,fs))+'px';
  if(fs<MIN){el.classList.add('clip');el.parentNode.title=a+(z?'\n'+z:'')}else{el.classList.remove('clip');el.parentNode.removeAttribute('title')}}window.__fitDone=(window.__fitDone||0)+1}
fit();
document.fonts.load('600 14px MB',ts.map(e=>e.textContent+(e.dataset.alt||'')).join('')).then(()=>{cache=new Map();fit()});
let lw=0;new ResizeObserver(()=>{const w=document.querySelector('#side').clientWidth;if(w!==lw){lw=w;fit()}}).observe(document.querySelector('#side'));
</script></body></html>
