function md(x){const L=x.split('\n'),out=[];let i=0,m;
 while(i<L.length){const l=L[i];
  if(!l.trim()){i++;continue}
  if(/^\s*```/.test(l)){const b=[];i++;while(i<L.length&&!/^\s*```/.test(L[i]))b.push(L[i++]);i++;out.push('<pre><code>'+esc(b.join('\n'))+'</code></pre>');continue}
  if(m=l.match(/^(#{1,6})\s+(.*)/)){const n=Math.min(6,m[1].length+2);out.push(`<h${n}>${inl(m[2])}</h${n}>`);i++;continue}
  if(m=l.match(BOLDLINE)){out.push(`<h4>${inl(m[1])}</h4>`);i++;continue}
  if(/^\s*>/.test(l)){const b=[];while(i<L.length&&/^\s*>/.test(L[i]))b.push(L[i++].replace(/^\s*>\s?/,''));out.push('<blockquote>'+b.map(inl).join('<br>')+'</blockquote>');continue}
  if(/^\s*[-*•]\s+/.test(l)){const b=[];while(i<L.length&&/^\s*[-*•]\s+/.test(L[i]))b.push(L[i++].replace(/^\s*[-*•]\s+/,''));out.push('<ul>'+b.map(s=>'<li>'+inl(s)+'</li>').join('')+'</ul>');continue}
  if(m=l.match(/^\s*(\d+)[.)、]\s+/)){const st=+m[1],b=[];while(i<L.length&&/^\s*\d+[.)、]\s+/.test(L[i]))b.push(L[i++].replace(/^\s*\d+[.)、]\s+/,''));out.push(`<ol start="${st}">`+b.map(s=>'<li>'+inl(s)+'</li>').join('')+'</ol>');continue}
  const b=[l];i++;while(i<L.length&&L[i].trim()&&!BLK.test(L[i])&&!BOLDLINE.test(L[i]))b.push(L[i++]);
  out.push('<p>'+b.map(inl).join('<br>')+'</p>')}
 return out}
let paintTok=0;
function wcount(x){const c=(x.match(/[\u3400-\u9fff\uf900-\ufaff\u3040-\u30ff\uac00-\ud7af]/g)||[]).length,w=(x.match(/[A-Za-z0-9]+(?:['’.-][A-Za-z0-9]+)*/g)||[]).length;return {c,w,m:Math.max(1,Math.ceil(c/400+w/230))}}
function paint(x){const el=$('#txt');if(!el)return;{const w=$('#wc');if(w){const r=wcount(x),n=r.c+r.w;w.textContent=` · ${n.toLocaleString('en-US')} 字 · 约 ${r.m} 分钟`}}const tok=++paintTok,bs=md(x);el.textContent='';{const it=ITEMS[cur];if(it&&it.source==='财新'&&it.link)el.insertAdjacentHTML('beforeend',`<p class="cx-src">原文：<a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.link)} ↗</a></p>`)}

function clean(x,i){const L=x.split('\n'),T=(i.title||'').trim();let k=0;
 while(k<L.length&&k<6){const l=L[k].trim();if(!l||(i.link&&l===i.link)||(T&&l.startsWith(T))||/^https?:\/\/\S+$/.test(l)&&k<2)k++;else break}return L.slice(k).join('\n')}
function fromHash(){const {id}=readHash();const n=ITEMS.findIndex(i=>i.id===id);if(n>=0&&n!==cur)show(n,false)}
const sw=(a,on)=>{const t=a&&a.querySelector('.t[data-alt]');if(!t)return;if(on&&!t.dataset.cur){t.dataset.cur=t.textContent;t.textContent=t.dataset.alt}else if(!on&&t.dataset.cur){t.textContent=t.dataset.cur;delete t.dataset.cur}};
$('#list').addEventListener('mouseover',e=>sw(e.target.closest('.it'),1));

let lp,lpA,lpDone=0;$('#list').addEventListener('touchstart',e=>{lpA=e.target.closest('.it');lpDone=0;lp=setTimeout(()=>{sw(lpA,1);lpDone=1},450)},{passive:true});

<script type="module">
// Fit each title on ONE line: one font size per row so original AND Chinese both fit (zero shift on swap).
const FAM='MB,-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif',REF=100,MIN=11,MAX=14;
let measure;
try{const P=await import('https://cdn.jsdelivr.net/npm/@chenglou/pretext@0.0.9/+esm');

catch(e){const c=document.createElement('canvas').getContext('2d');measure=(t,f)=>{c.font=f;return c.measureText(t).width};window.__fitEngine='canvas'}
let cache=new Map();const allT=()=>[...document.querySelectorAll('#list .it .t')];
const wOf=t=>{const f=`600 ${REF}px ${FAM}`,k=t;if(!cache.has(k))cache.set(k,measure(t,f));return cache.get(k)};
function fit(){const ts=allT();const sample=ts[0];if(!sample)return;const avail=sample.clientWidth-2;
 for(const el of ts){const a=el.dataset.cur||el.textContent,z=el.dataset.alt||'';const w=Math.max(wOf(a),z?wOf(z):0);
  const fs=Math.floor(avail*REF/w*10)/10;el.style.fontSize=Math.max(MIN,Math.min(MAX,fs))+'px';
  if(fs<MIN){el.classList.add('clip');el.parentNode.title=a+(z?'\n'+z:'')}else{el.classList.remove('clip');el.parentNode.removeAttribute('title')}}window.__fitDone=(window.__fitDone||0)+1}
fit();
document.fonts.load('600 14px MB',ITEMS.map(i=>(i.title_zh||'')+(i.title||'')).join('')).then(()=>{cache=new Map();fit()});
window.__refit=fit;
let lw=0;new ResizeObserver(()=>{const w=document.querySelector('#side').clientWidth;if(w!==lw){lw=w;fit()}}).observe(document.querySelector('#side'));
</script></body></html>
